<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SP 临床统计编程知识库：记录、检索和查阅实用笔记。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="canonical" href="https://sp.769967.xyz/">
  <link rel="stylesheet" href="/assets/style.css">
  <title>SP · 临床统计编程知识库</title>
</head>
<body>
  <div class="shell" id="top">
    <header class="site-header">
      <a class="brand" href="/" aria-label="SP 首页">SP.</a>
      <nav class="tool-links" aria-label="常用工具">
        <a href="https://xpt.769967.xyz" target="_blank" rel="noopener noreferrer">XPT Viewer <span aria-hidden="true">↗</span></a>
        <a href="https://ct.769967.xyz" target="_blank" rel="noopener noreferrer">CT Mapping <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main class="knowledge-main">
      <h1>知识库</h1>
      <label class="search-wrap">
        <span class="visually-hidden">检索文章</span>
        <input id="article-search" type="search" placeholder="搜索文章或关键词…" autocomplete="off" spellcheck="false">
      </label>
      <ul class="article-list" id="article-list" aria-label="文章列表">
        <li class="article-item" data-search="常用 pk 参数 药代动力学 tmax cmax ctrough lambda_z 半衰期 hl_lambda_z aucinf auclst auctau aucint mrtinf rsq_adj cl cl/f df 清除率 波动指数 最佳拟合 末端消除速率常数">
          <a href="/pk-parameters/"><span>常用 PK 参数</span><span class="arrow" aria-hidden="true">→</span></a>
        </li>
      </ul>
      <p class="empty-search" id="empty-search" role="status" hidden>没有找到匹配的文章。</p>
    </main>
    <footer class="site-footer"><span>by dw</span><span>V0.1.3</span></footer>
  </div>
  <script>
    (() => {
      const input = document.getElementById('article-search');
      const items = Array.from(document.querySelectorAll('#article-list .article-item'));
      const empty = document.getElementById('empty-search');
      const normalize = s => s.normalize('NFKC').toLocaleLowerCase().trim();
      const apply = () => {
        const words = normalize(input.value).split(/\s+/).filter(Boolean);
        let visible = 0;
        for (const item of items) {
          const haystack = normalize(item.dataset.search || item.textContent);
          const matches = words.every(word => haystack.includes(word));
          item.hidden = !matches;
          if (matches) visible++;
        }
        empty.hidden = visible !== 0;
      };
      input.addEventListener('input', apply);
      apply();
    })();
  </script>
</body>
</html>
